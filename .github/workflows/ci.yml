name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality and security gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
          --name ci-mongo
        env:
          MONGO_INITDB_DATABASE: talas-test
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      APP_URL: http://127.0.0.1:3000
      DATABASE_URL: mongodb://127.0.0.1:27017/talas-test
      REDIS_URL: redis://127.0.0.1:6379
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: talas-test
      S3_ACCESS_KEY_ID: talas
      S3_SECRET_ACCESS_KEY: talas-local-secret
      S3_FORCE_PATH_STYLE: 'true'
      CLAMAV_HOST: 127.0.0.1
      CLAMAV_PORT: '3310'
      JWT_ACCESS_SECRET: ci-access-secret-with-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-with-at-least-32-characters
      CSRF_SECRET: ci-csrf-secret-with-at-least-32-characters
      EMAIL_TRANSPORT: memory
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize MongoDB replica set
        run: |
          docker exec ci-mongo mongosh --quiet --eval \
            "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] })"
          for i in $(seq 1 30); do
            if docker exec ci-mongo mongosh --quiet --eval \
              "db.hello().isWritablePrimary" | grep -q true; then exit 0; fi
            sleep 1
          done
          exit 1

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: OpenAPI lint
        run: pnpm openapi:lint

      - name: Unit tests
        run: pnpm test:unit

      - name: Security tests
        run: pnpm test:security

      - name: Build
        run: pnpm build

      - name: Contract tests
        run: pnpm test:contract

      - name: Integration tests
        run: pnpm test:integration

      - name: Dependency audit
        run: pnpm audit --audit-level=high

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
