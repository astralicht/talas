name: E2E

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'hooks/**'
      - 'lib/auth/**'
      - 'lib/lessons/**'
      - 'tests/e2e/**'
      - 'playwright.config.ts'

permissions:
  contents: read

jobs:
  playwright:
    name: Critical-path browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
          --name e2e-mongo
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      NODE_ENV: test
      APP_URL: http://127.0.0.1:3100
      DATABASE_URL: mongodb://127.0.0.1:27017/talas-e2e
      REDIS_URL: redis://127.0.0.1:6379
      JWT_ACCESS_SECRET: e2e-access-secret-with-at-least-32-characters
      JWT_REFRESH_SECRET: e2e-refresh-secret-with-at-least-32-characters
      CSRF_SECRET: e2e-csrf-secret-with-at-least-32-characters
      EMAIL_TRANSPORT: memory
      LOG_LEVEL: silent
      E2E_MODE: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Initialize MongoDB replica set
        run: |
          docker exec e2e-mongo mongosh --quiet --eval \
            "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] })"

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
